<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 368" role="img" aria-label="Green Living — Nature Inside the Architecture">
    <defs>
        <linearGradient id="gl-gold" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E9D19A"/><stop offset=".55" stop-color="#C5A66B"/><stop offset="1" stop-color="#A9853F"/>
        </linearGradient>
        <radialGradient id="gl-sun" cx=".5" cy=".42" r=".7">
            <stop offset="0" stop-color="#F6E5B8"/><stop offset=".72" stop-color="#DCC084"/><stop offset="1" stop-color="#C5A66B"/>
        </radialGradient>
        <linearGradient id="gl-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FAF6EC"/><stop offset="1" stop-color="#E7DCC1"/>
        </linearGradient>
        <linearGradient id="gl-peak-back" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2E5F57"/><stop offset="1" stop-color="#1C443E"/>
        </linearGradient>
        <linearGradient id="gl-peak-front" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#1E4640"/><stop offset="1" stop-color="#122E29"/>
        </linearGradient>
        <linearGradient id="gl-ground" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F3EDDC"/><stop offset="1" stop-color="#DCCFB2"/>
        </linearGradient>
        <clipPath id="gl-clip"><circle cx="100" cy="100" r="84"/></clipPath>
    </defs>

    <g transform="translate(60,4)">
        <circle cx="100" cy="100" r="96" fill="none" stroke="url(#gl-gold)" stroke-width="3"/>
        <circle cx="100" cy="100" r="89.5" fill="none" stroke="url(#gl-gold)" stroke-width="1" opacity=".65"/>
        <g clip-path="url(#gl-clip)">
            <circle cx="100" cy="100" r="84" fill="url(#gl-sky)"/>
            <g stroke="url(#gl-gold)" stroke-width="2.4" stroke-linecap="round">
                <line x1="125.4" y1="58.8" x2="132.9" y2="56"/>
                <line x1="117.4" y1="47.3" x2="122.5" y2="41.2"/>
                <line x1="104.7" y1="41.4" x2="106.1" y2="33.5"/>
                <line x1="95.3"  y1="41.4" x2="93.9" y2="33.5"/>
                <line x1="82.6"  y1="47.3" x2="77.5" y2="41.2"/>
                <line x1="74.6"  y1="58.8" x2="67.1" y2="56"/>
            </g>
            <circle cx="100" cy="68" r="23" fill="url(#gl-sun)"/>
            <path d="M50 132 L100 80 L150 132 Z" fill="url(#gl-peak-back)"/>
            <path d="M100 80 L86 99" fill="none" stroke="#E9D19A" stroke-width="1.6" opacity=".85"/>
            <path d="M20 132 L68 82 L116 132 Z" fill="url(#gl-peak-front)"/>
            <path d="M68 82 L56 100" fill="none" stroke="#DCC084" stroke-width="1.2" opacity=".6"/>
            <path d="M84 132 L132 82 L180 132 Z" fill="url(#gl-peak-front)"/>
            <path d="M132 82 L144 100" fill="none" stroke="#DCC084" stroke-width="1.2" opacity=".6"/>
            <rect x="14" y="130" width="172" height="58" fill="url(#gl-ground)"/>
            <line x1="16" y1="130.5" x2="184" y2="130.5" stroke="#C5A66B" stroke-width="1" opacity=".45"/>
            <path d="M100 131 C 90 139, 112 146, 100 154 C 90 161, 110 167, 100 174"
                  fill="none" stroke="url(#gl-gold)" stroke-width="2.6" stroke-linecap="round"/>
            <path d="M60 162 C 38 154, 23 131, 27 101 C 51 110, 64 133, 60 162 Z" fill="#255A4C"/>
            <path d="M57 157 C 45 143, 35 124, 31 106" fill="none" stroke="url(#gl-gold)" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M48 139 L55 133 M41 127 L47 121 M36 117 L41 112" stroke="url(#gl-gold)" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M140 162 C 162 154, 177 131, 173 101 C 149 110, 136 133, 140 162 Z" fill="#255A4C"/>
            <path d="M143 157 C 155 143, 165 124, 169 106" fill="none" stroke="url(#gl-gold)" stroke-width="1.7" stroke-linecap="round"/>
            <path d="M152 139 L145 133 M159 127 L153 121 M164 117 L159 112" stroke="url(#gl-gold)" stroke-width="1.3" stroke-linecap="round"/>
        </g>
    </g>

    <!-- Wordmark (for dark / navy backgrounds) -->
    <text x="163" y="290" text-anchor="middle"
          font-family="Cinzel, 'Playfair Display', Georgia, serif"
          font-size="29" font-weight="700" letter-spacing="6.5"
          fill="#F5F1E7">GREEN LIVING</text>

    <line x1="96"  y1="308" x2="146" y2="308" stroke="url(#gl-gold)" stroke-width="1.4"/>
    <line x1="174" y1="308" x2="224" y2="308" stroke="url(#gl-gold)" stroke-width="1.4"/>
    <path d="M160 302 C 156 305.5, 156 310.5, 160 313.5 C 164 310.5, 164 305.5, 160 302 Z" fill="#C5A66B"/>

    <text x="160" y="336" text-anchor="middle"
          font-family="Cinzel, 'Playfair Display', Georgia, serif"
          font-size="9.5" letter-spacing="3.4"
          fill="#C9B285">NATURE INSIDE THE ARCHITECTURE</text>
</svg>
